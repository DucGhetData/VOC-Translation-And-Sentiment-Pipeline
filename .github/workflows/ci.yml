"""
VOC Pipeline — CI/CD GitHub Actions Workflow
=============================================
Pull Request CI: lint, type-check, test
Merge to main CD: terraform plan → apply
"""
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint & Type Check ─────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff black mypy sqlfluff boto3-stubs[s3,comprehend,translate]

      - name: Ruff (linting)
        run: ruff check src/ dags/ tests/

      - name: Black (formatting)
        run: black --check src/ dags/ tests/

      - name: Mypy (type checking)
        run: mypy src/

      - name: SQLFluff (SQL linting)
        run: sqlfluff lint sql/ --dialect ansi --templater jinja
        continue-on-error: true  # non-blocking for now

  # ── Unit Tests ────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/unit/ -v --cov=src --cov-report=xml
        env:
          AWS_DEFAULT_REGION: ap-southeast-1
          # moto mocks AWS — no real credentials needed for unit tests
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  # ── Docker Build Test ─────────────────────────────────────
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

  # ── Airflow DAG Import Test ───────────────────────────────
  airflow-dag-test:
    name: Airflow DAG Import Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Airflow
        run: |
          pip install "apache-airflow==2.10.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.12.txt"

      - name: Test DAG imports
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'src')
          os.environ['AIRFLOW__CORE__DAGS_FOLDER'] = 'dags'
          from airflow.models import DagBag
          dag_bag = DagBag(dag_folder='dags', include_examples=False)
          assert not dag_bag.import_errors, f'DAG import errors: {dag_bag.import_errors}'
          print(f'✅ {len(dag_bag.dags)} DAG(s) imported successfully')
          "
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow_test.db

  # ── Terraform Validate ────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
